name: Publish Foundry release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Check tag and syntax
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "v$(node -p 'JSON.parse(require("fs").readFileSync("module.json", "utf8")).version')"
          for f in scripts/*.mjs; do node --check "$f"; done
          node -e 'const m = require("./module.json"); if (m.id !== "book-compendium-converter") process.exit(1)'

      - name: Package distribution
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          zip -q -r dist/book-compendium-converter.zip module.json README.md LICENSE scripts styles
          cp module.json dist/module.json
          unzip -tq dist/book-compendium-converter.zip

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/book-compendium-converter.zip
            dist/module.json
          generate_release_notes: true
          make_latest: true
          prerelease: false
